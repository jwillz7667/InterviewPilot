</div>
<div class="flex-grow">
<h3 class="text-xl font-bold text-on-surface">Get a new job</h3>
<p class="text-on-surface-variant text-sm font-body">Focus on mock interviews and career coaching.</p>
</div>
<div class="flex-shrink-0 ml-4">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>

</div>
<div class="flex-grow">
<h3 class="text-xl font-bold text-on-surface">Practice coding</h3>
<p class="text-on-surface-variant text-sm font-body">Sharpen algorithm skills and system design logic.</p>
</div>
<div class="flex-shrink-0 ml-4 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Choice Card: Communication -->

<div class="flex-shrink-0 ml-4 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>

<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
