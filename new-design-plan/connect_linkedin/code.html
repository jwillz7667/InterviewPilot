<body class="antialiased text-on-surface bg-white">
<!-- Top Navigation Anchor (Suppressed based on Transactional Policy, but keeping minimal branding) -->
<header class="w-full top-0 border-b border-slate-100 bg-white">
<div class="flex items-center px-6 h-20 w-full max-w-7xl mx-auto justify-between">
<span class="text-xl font-bold text-primary-container font-headline tracking-tight">Interview Ace</span>
<div class="h-1 w-12 bg-surface-container rounded-full overflow-hidden">
<div class="h-full w-1/3 bg-primary-container rounded-full"></div>
</div>
</div>
</header>
<main class="min-h-[calc(100vh-80px)] flex flex-col items-center justify-center px-6 pb-24 max-w-2xl mx-auto">
<!-- Illustration/Icon Section -->
<div class="mb-12 relative">
<div class="w-24 h-24 rounded-full bg-primary-container/5 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container text-5xl" data-icon="link">link</span>
</div>
<!-- Subtle accent circles for depth -->
<div class="absolute -top-4 -right-4 w-8 h-8 rounded-full bg-tertiary-fixed-dim/20 blur-xl"></div>
</div>
<!-- Content Section -->
<div class="text-center mb-10">
<h1 class="font-extrabold text-on-surface font-headline mb-4 tracking-tight text-4xl">
                Personalize your experience
            </h1>
<p class="text-on-surface-variant font-body leading-relaxed text-xl">
                We'll use your LinkedIn profile to customize your interview practice sessions and track your progress.
            </p>
</div>
<!-- Input Section -->
<div class="w-full space-y-6">
<div class="relative group">
<label class="block text-sm font-semibold text-on-surface-variant mb-2 ml-1 font-label" for="linkedin_url">
                    What's your LinkedIn URL?
                </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl" data-icon="share">share</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-white border-2 border-slate-100 rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary-container transition-all duration-200 outline-none text-on-surface placeholder:text-slate-300 font-medium" id="linkedin_url" name="linkedin_url" placeholder="linkedin.com/in/username" type="url"/>
</div>
</div>
<button class="w-full bg-[#1978e5] text-white font-bold py-5 px-8 rounded-xl hover:shadow-xl hover:shadow-primary/20 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 group">
<span>Connect</span>
<span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Secondary Actions -->
<div class="mt-12 text-center">
<button class="text-outline hover:text-primary-container font-semibold transition-colors flex items-center gap-1 mx-auto font-label">
                Skip for now
            </button>
</div>
<!-- Visual Anchor Background Decoration -->
<div class="fixed bottom-0 left-0 right-0 -z-10 h-64 opacity-5 pointer-events-none overflow-hidden">
<div class="absolute bottom-[-100px] left-[-50px] w-96 h-96 rounded-full bg-primary blur-[120px]"></div>
<div class="absolute bottom-[-150px] right-[-50px] w-96 h-96 rounded-full bg-tertiary blur-[120px]"></div>
</div>
</main>
