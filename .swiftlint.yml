included:
  - InterviewPilot

excluded:
  - build
  - DerivedData
  - .build
  - InterviewPilot.xcodeproj
  - "**/*.generated.swift"

# Phase C rollout: warn-first; tighten to errors after the first cleanup PR.
disabled_rules:
  - todo
  - line_length            # tighten via opt_in once typography pass settles
  - trailing_comma
  - multiple_closures_with_trailing_closure
  - cyclomatic_complexity
  - function_body_length
  - file_length
  - type_body_length
  - large_tuple
  - identifier_name        # SwiftUI uses single-letter generics + 2-letter names
  - nesting

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unused_import
  - unused_declaration
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

force_unwrapping:
  severity: warning
force_cast:
  severity: warning
force_try:
  severity: warning

reporter: "xcode"
