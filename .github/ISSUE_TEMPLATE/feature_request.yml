name: Feature Request
description: Propose a new feature or improvement
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Strong proposals describe the user need first and the implementation second.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem are we solving? Who experiences it, and how often?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the change at a high level. Include alternative approaches you considered and why you ruled them out.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - iOS application
        - Backend API
        - Both iOS and backend
        - Build / CI
        - Documentation
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: What would make this feature "done"? Measurable outcomes preferred.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks, costs, or open questions
      description: Anything that could complicate this — third-party dependencies, schema migrations, App Store review, premium feature gating, etc.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: This proposal aligns with InterviewPilot's product focus on real-time interview assistance.
          required: true
