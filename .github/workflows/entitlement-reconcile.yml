name: Entitlement reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/entitlement-reconcile.yml'
  schedule:
    # Hourly at minute 17 — offset from common :00/:30 cron times so we don't
    # collide with other scheduled jobs.
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check scheduled-job configuration
        id: config
        working-directory: ${{ github.workspace }}
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SLACK_OPS_WEBHOOK: ${{ secrets.SLACK_OPS_WEBHOOK }}
        run: |
          if [ -n "$PROD_DATABASE_URL" ]; then
            echo "database_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "database_configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PROD_DATABASE_URL is not configured; skipping entitlement reconciliation."
            echo "### Entitlement reconciliation skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The repository secret \`PROD_DATABASE_URL\` is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$SLACK_OPS_WEBHOOK" ]; then
            echo "slack_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "slack_configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.database_configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.database_configured == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        if: steps.config.outputs.database_configured == 'true'
      - run: npx prisma generate
        if: steps.config.outputs.database_configured == 'true'
      - name: Run reconciliation
        if: steps.config.outputs.database_configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          NODE_ENV: production
        run: npx tsx scripts/reconcile-entitlements.ts
      - name: Notify on drift
        if: failure() && steps.config.outputs.slack_configured == 'true'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "⚠️ Entitlement reconciliation reported >0.5% drift — see <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
      - name: Record unavailable Slack alerting
        if: failure() && steps.config.outputs.slack_configured != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          echo "::warning::SLACK_OPS_WEBHOOK is not configured; failure notification was not sent."
          echo "Slack alerting is unavailable because \`SLACK_OPS_WEBHOOK\` is not configured." >> "$GITHUB_STEP_SUMMARY"
