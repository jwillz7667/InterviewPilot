name: Entitlement reconciliation

on:
  schedule:
    # Hourly at minute 17 — offset from common :00/:30 cron times so we don't
    # collide with other scheduled jobs.
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Run reconciliation
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          NODE_ENV: production
        run: npx tsx scripts/reconcile-entitlements.ts
      - name: Notify on drift
        if: failure()
        uses: slackapi/slack-github-action@v3
        with:
          payload: |
            {
              "text": "⚠️ Entitlement reconciliation reported >0.5% drift — see <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_OPS_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
