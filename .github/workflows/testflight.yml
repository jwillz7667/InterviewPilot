name: TestFlight (manual)

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: TestFlight changelog
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          python3 - <<'PY'
          import subprocess
          version = subprocess.check_output(["xcodebuild", "-version"], text=True).split()[1]
          if tuple(int(part) for part in version.split(".")[:2]) < (26, 1):
              raise SystemExit("Xcode 26.1 or later is required.")
          PY
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Test core behavior
        run: swift test
      - name: Verify signing configuration
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::Configure App Store Connect signing before running this optional workflow."
            exit 1
          fi
      - name: Upload personal build
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          FASTLANE_HIDE_CHANGELOG: 1
          TESTFLIGHT_CHANGELOG: ${{ inputs.changelog }}
        run: bundle exec fastlane beta
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-output
          path: |
            build/fastlane/**/*.ipa
            build/fastlane/**/*.dSYM.zip
            fastlane/report.xml
          retention-days: 14
