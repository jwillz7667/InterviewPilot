name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "perf/**"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: iOS build and core tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          python3 - <<'PY'
          import subprocess
          version = subprocess.check_output(["xcodebuild", "-version"], text=True).split()[1]
          if tuple(int(part) for part in version.split(".")[:2]) < (26, 1):
              raise SystemExit("Xcode 26.1 or later is required.")
          PY
      - name: Test core behavior
        run: swift test
      - name: Build iOS simulator app
        run: |
          xcodebuild -project InterviewPilot.xcodeproj \
            -scheme InterviewPilot \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
