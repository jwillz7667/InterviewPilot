name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"
      - "feat/**"
      - "fix/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-typecheck:
    name: Backend · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  backend-lint:
    name: Backend · lint + format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format

  backend-unit:
    name: Backend · unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  backend-integration:
    name: Backend · integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interviewpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interviewpilot_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Integration tests
        run: npm run test:integration --if-present

  ios-build:
    name: iOS · build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          ls /Applications | grep -i ^Xcode
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Download missing iOS platform (best-effort)
        run: |
          # Apple's CDN intermittently returns "iOS latest is not available for download."
          # Treat this step as best-effort — the runner ships with a recent iOS Simulator
          # runtime, and the next step picks the highest installed one.
          sudo xcodebuild -downloadPlatform iOS -buildVersion latest || \
            echo "::warning::xcodebuild -downloadPlatform iOS failed; falling back to pre-installed runtime"
        timeout-minutes: 15
        continue-on-error: true
      - name: Resolve simulator UDID
        id: dest
        run: |
          xcrun simctl list runtimes
          # Find any existing-and-available iPhone simulator on the highest
          # installed iOS runtime. Pass its UDID directly so xcodebuild
          # doesn't try to fall back to a placeholder device on the iOS 26.5
          # platform (which isn't installed on the runner).
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          rts = sorted(
              [k for k in data if "iOS" in k],
              key=lambda k: tuple(int(x) for x in k.split(".iOS-")[-1].split("-")),
              reverse=True,
          )
          for r in rts:
              for d in data[r]:
                  if d.get("isAvailable", True) and "iPhone" in d.get("name", ""):
                      print(d["udid"])
                      sys.exit(0)
          sys.exit("no iPhone simulator available")
          ')
          echo "Using simulator UDID=$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build iOS App
        run: xcodebuild -project InterviewPilot.xcodeproj -scheme InterviewPilot -configuration Debug -destination "id=${{ steps.dest.outputs.udid }}" build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
